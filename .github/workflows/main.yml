name: Build Socks5 IPA (Unsigned)

on:
  push:
    branches:
      - codex/faster-ipa-build-20261002
  workflow_dispatch:
    inputs:
      include_simulators:
        description: Include iOS simulator libraries in the XCFramework (slower)
        type: boolean
        default: false

env:
  HEV_REV: 52d7e475ef932e93540d1d964e02839f233ad981

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout socks5-ios
        uses: actions/checkout@v4

      - name: Read Apple build settings
        id: build-settings
        run: |
          echo "jobs=$(sysctl -n hw.logicalcpu)" >> "$GITHUB_OUTPUT"
          xcodebuild -version > "$RUNNER_TEMP/hev-toolchain.txt"
          xcrun --sdk iphoneos --show-sdk-build-version >> "$RUNNER_TEMP/hev-toolchain.txt"
          xcrun --sdk iphonesimulator --show-sdk-build-version >> "$RUNNER_TEMP/hev-toolchain.txt"
          TOOLCHAIN=$(shasum -a 256 "$RUNNER_TEMP/hev-toolchain.txt" | awk '{print $1}')
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Restore patched iOS XCFramework
        id: hev-cache
        uses: actions/cache/restore@v4
        with:
          path: build/HevSocks5Server.xcframework
          key: hev-ios-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-settings.outputs.toolchain }}-${{ env.HEV_REV }}-${{ inputs.include_simulators || false }}-${{ hashFiles('patches/hev-socks5-server-udp-associate-port0.patch', 'scripts/build-hev-ios.sh') }}

      - name: Build engine and run smoke test
        env:
          BUILD_JOBS: ${{ steps.build-settings.outputs.jobs }}
        run: |
          git clone https://github.com/heiher/hev-socks5-server
          cd hev-socks5-server
          git checkout "$HEV_REV"
          git submodule update --init --recursive --jobs "$BUILD_JOBS"
          git apply ../patches/hev-socks5-server-udp-associate-port0.patch
          make -j"$BUILD_JOBS" exec
          cat > /tmp/hev-socks5-smoke.yml <<'EOF'
          main:
            workers: 1
            port: 18888
            listen-address: '127.0.0.1'
            udp-port: 18888
            udp-listen-address: '127.0.0.1'
            listen-ipv6-only: false
            bind-address-v4: '0.0.0.0'
            bind-address-v6: '::'
            bind-interface: ''
          misc:
            log-level: debug
            log-file: stderr
            udp-read-write-timeout: 10000
          EOF
          ./bin/hev-socks5-server /tmp/hev-socks5-smoke.yml &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python3 - <<'PY'
          import os, socket, struct, threading, time

          proxy = ("127.0.0.1", 18888)
          echo = ("127.0.0.1", 19999)
          tcp_echo = ("127.0.0.1", 19998)

          def echo_server():
              s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              s.bind(echo)
              while True:
                  data, addr = s.recvfrom(2048)
                  s.sendto(data, addr)

          threading.Thread(target=echo_server, daemon=True).start()

          def tcp_echo_server():
              s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              s.bind(tcp_echo)
              s.listen(8)
              while True:
                  conn, _ = s.accept()
                  threading.Thread(target=tcp_echo_conn, args=(conn,),
                                   daemon=True).start()

          def tcp_echo_conn(conn):
              with conn:
                  while True:
                      data = conn.recv(65536)
                      if not data:
                          return
                      conn.sendall(data)

          threading.Thread(target=tcp_echo_server, daemon=True).start()

          def read_exact(sock, n):
              data = b""
              while len(data) < n:
                  chunk = sock.recv(n - len(data))
                  if not chunk:
                      raise RuntimeError("tcp closed")
                  data += chunk
              return data

          def associate():
              tcp = socket.create_connection(proxy, timeout=5)
              tcp.sendall(b"\x05\x01\x00")
              assert read_exact(tcp, 2) == b"\x05\x00"
              tcp.sendall(b"\x05\x03\x00\x01\x00\x00\x00\x00\x00\x00")
              head = read_exact(tcp, 4)
              assert head[:3] == b"\x05\x00\x00", head.hex()
              assert head[3] == 1, head.hex()
              tail = read_exact(tcp, 6)
              return tcp, (".".join(map(str, tail[:4])), struct.unpack("!H", tail[4:])[0])

          for _ in range(40):
              try:
                  tcp, udp_relay = associate()
                  break
              except Exception:
                  time.sleep(0.25)
          else:
              raise RuntimeError("server did not start")

          udp = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          udp.settimeout(5)
          payload = os.urandom(32)
          req = b"\x00\x00\x00\x01" + socket.inet_aton(echo[0]) + struct.pack("!H", echo[1]) + payload
          udp.sendto(req, udp_relay)
          data, _ = udp.recvfrom(2048)
          off = 10 if data[3] == 1 else None
          assert off and data[off:] == payload, data.hex()

          # TCP CONNECT with payloads larger than the task stack.
          def connect_via_proxy(host, port):
              s = socket.create_connection(proxy, timeout=10)
              s.sendall(b"\x05\x01\x00")
              assert read_exact(s, 2) == b"\x05\x00"
              s.sendall(b"\x05\x01\x00\x01" + socket.inet_aton(host)
                        + struct.pack("!H", port))
              head = read_exact(s, 4)
              assert head[:2] == b"\x05\x00", head.hex()
              read_exact(s, 6 if head[3] == 1 else 18)
              return s

          conn = connect_via_proxy(*tcp_echo)
          blob = os.urandom(1 << 20)
          received = bytearray()

          def drain():
              while len(received) < len(blob):
                  chunk = conn.recv(65536)
                  if not chunk:
                      break
                  received.extend(chunk)

          reader = threading.Thread(target=drain, daemon=True)
          reader.start()
          conn.sendall(blob)
          reader.join(30)
          assert bytes(received) == blob, (len(received), len(blob))
          conn.close()

          # Leave the UDP association open so the stop path has to tear the
          # dispatcher down itself.
          PY
          # The UDP dispatcher must not keep the task system alive after a stop.
          kill -INT $SERVER_PID
          for _ in $(seq 1 50); do
            kill -0 $SERVER_PID 2>/dev/null || break
            sleep 0.2
          done
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "server did not exit after stop"
            kill -9 $SERVER_PID || true
            exit 1
          fi
          trap - EXIT
          make clean

      - name: Build patched iOS XCFramework
        if: steps.hev-cache.outputs.cache-hit != 'true'
        env:
          BUILD_JOBS: ${{ steps.build-settings.outputs.jobs }}
          INCLUDE_SIMULATORS: ${{ inputs.include_simulators || false }}
        run: |
          bash scripts/build-hev-ios.sh \
            "$GITHUB_WORKSPACE/hev-socks5-server" \
            "$GITHUB_WORKSPACE/build/HevSocks5Server.xcframework" \
            "$INCLUDE_SIMULATORS"

      # Keep the expensive engine build even if a later Swift build fails.
      - name: Save patched iOS XCFramework
        if: steps.hev-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/HevSocks5Server.xcframework
          key: ${{ steps.hev-cache.outputs.cache-primary-key }}

      - name: Install patched iOS XCFramework
        run: |
          rsync -a --delete build/HevSocks5Server.xcframework/ HevSocks5Server.xcframework/

      - name: Build (Unsigned)
        env:
          BUILD_JOBS: ${{ steps.build-settings.outputs.jobs }}
        run: |
          xcodebuild build \
            -project Socks5.xcodeproj \
            -scheme Socks5 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            -parallelizeTargets \
            -jobs "$BUILD_JOBS" \
            -showBuildTimingSummary \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "Socks5.app" -not -path "*/simulator/*" | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p build/ipa/Payload
          cp -r "$APP_PATH" build/ipa/Payload/Socks5.app
          cd build/ipa
          zip -r Socks5-unsigned.ipa Payload
          echo "IPA size: $(du -sh Socks5-unsigned.ipa)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Socks5-IPA-Unsigned
          path: build/ipa/Socks5-unsigned.ipa
          retention-days: 7
          compression-level: 0

      - name: Upload patched xcframework
        uses: actions/upload-artifact@v4
        with:
          name: HevSocks5Server-xcframework-patched
          path: build/HevSocks5Server.xcframework
          retention-days: 7
